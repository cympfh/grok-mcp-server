[project]
name = "grok-mcp-server"
version = "1.0.0"
description = "MCP server for real-time X/Twitter search using xAI Grok API"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "httpx>=0.28.1",
    "mcp>=2.0.0",
    "xai-sdk>=1.17.0",
]

[project.scripts]
grok-mcp-server = "server:main"
